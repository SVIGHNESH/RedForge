# bench/scenarios.conf - the evaluation scenarios of synopsis Table 7.1,
# read by bench/run.sh (MASTER-PLAN MS8 P8.1 and P8.6).
#
# One line per benchmark stream, fields separated by '|':
#
#   scenario|subcase|policy|stream|preload|redis-benchmark arguments
#
# scenario  number from Table 7.1.
# subcase   name of one measured configuration of that scenario.
# policy    --appendfsync for both servers: always, everysec or no.
# stream    empty for a single benchmark process. Lines that share a
#           scenario and subcase are run concurrently against the same server,
#           and the stream name tells their output files apart.
# preload   redis-benchmark arguments run once after the server starts and
#           before anything is timed, or '-' for none.
# arguments passed to redis-benchmark after '-p PORT'.
#
# Both servers always get the same line, so the settings are matched.
# Output lands in bench/results/<date>/<target>/s<scenario>-<subcase>[-<stream>]-<run>.csv.

# Scenario 1: read baseline.
# Without -r every request uses the one key 'key:__rand_int__'. The preload
# stores a 64-byte value there, so GET returns 64 bytes instead of a nil.
1|get|everysec||-t set -d 64 -c 1 -n 1|-t get -d 64 -c 50 -n 1000000 -P 1

# Scenario 2: write baseline with the log on.
2|set|everysec||-|-t set -d 64 -c 50 -n 1000000 -P 1

# Scenario 3: 80/20 read/write mix.
# redis-benchmark cannot mix commands in one process (MASTER-PLAN Section 2
# item 4), so two processes run at once: 40 clients on GET and 10 on SET.
# Both do 20000 requests per client, so neither stream finishes long before
# the other.
3|mix|everysec|get|-t set -d 64 -c 1 -n 1|-t get -d 64 -c 40 -n 800000 -P 1
3|mix|everysec|set|-t set -d 64 -c 1 -n 1|-t set -d 64 -c 10 -n 200000 -P 1

# Scenario 4: large payload.
4|set4k|everysec||-|-t set -d 4096 -c 50 -n 300000 -P 1

# Scenario 5: client sweep with 16-command pipelines, at both fsync policies.
# Table 7.1 gives no request count here, so -n is sized from probe runs on the
# development machine (btrfs on an SSD, 2026-10-30). Under always, ours did
# 200 to 630 requests per second and Redis 7800 to 135000. 50000 requests keep
# a run of ours under about 4 minutes and give Redis at least half a second.
# Under everysec both servers did over 100000 per second at 50 clients.
# In the probe at 200 clients under always, every percentile of ours read
# 3000.3 ms, redis-benchmark's latency ceiling. run.sh marks any run that
# reaches it latency_capped; such a run reports throughput only.
5|c1-everysec|everysec||-|-t set -d 64 -P 16 -c 1 -n 1000000
5|c10-everysec|everysec||-|-t set -d 64 -P 16 -c 10 -n 1000000
5|c50-everysec|everysec||-|-t set -d 64 -P 16 -c 50 -n 1000000
5|c200-everysec|everysec||-|-t set -d 64 -P 16 -c 200 -n 1000000
5|c1-always|always||-|-t set -d 64 -P 16 -c 1 -n 50000
5|c10-always|always||-|-t set -d 64 -P 16 -c 10 -n 50000
5|c50-always|always||-|-t set -d 64 -P 16 -c 50 -n 50000
5|c200-always|always||-|-t set -d 64 -P 16 -c 200 -n 50000
